version: "1"
name: arkbase

services:
  # 1. Native PostgreSQL 17 managed via Nix
  postgres:
    command: nix shell nixpkgs#postgresql --command ./scripts/dev-postgres.sh
    healthcheck:
      test: ["CMD", "nix", "shell", "nixpkgs#postgresql", "--command", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "postgres", "-d", "dev_db"]
      interval: 1s
      retries: 25
      timeout: 2s

  # 2. Go API Server (daemon)
  api:
    command: go run ./cmd/arkbase run --config config.dev.yaml
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/status"]
      interval: 2s
      retries: 15
      timeout: 2s

  # 3. Vite React Frontend via Bun with HMR
  web:
    command: bun --cwd frontend dev --port 3000
    depends_on:
      api: { condition: service_healthy }
