# arkbase local development & testing configuration

server:
  port: 8080
  data_dir: ./data/arkbase
  auth:
    enabled: false

destinations:
  local_storage:
    type: filesystem
    path: ./backups/{{ .Database }}/{{ .Database }}_{{ .Timestamp }}.sql.gz
    retention:
      keep_last: 5
      daily: 7

  local_encrypted:
    type: filesystem
    path: ./backups/{{ .Database }}/{{ .Database }}_{{ .Timestamp }}.sql.gz.enc
    encryption:
      enabled: true
      passphrase: "dev-local-secret-passphrase"
    retention:
      keep_last: 5
      daily: 7

databases:
  dev_db:
    engine: postgres
    host: localhost
    port: 5432
    username: postgres
    password: ""
    database: dev_db
    sslmode: disable
    schedule: "*/5 * * * *" # Every 5 minutes
    destinations:
      - local_storage
      - local_encrypted
