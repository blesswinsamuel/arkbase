name: arkbase
primary: web

services:
  # 1. Native PostgreSQL 17 via Nix & Taskfile
  postgres:
    run: task dev:postgres
    ready:
      exec: nix shell nixpkgs#postgresql --command pg_isready -h localhost -p 5432 -U postgres -d dev_db
      interval: 1s
      retries: 25
      timeout: 2s

  # 2. Go API Server via Taskfile
  api:
    run: task dev:api
    port: 18082
    depends_on: [postgres]
    ready:
      http:
        path: /api/v1/status
      interval: 2s
      retries: 15
      timeout: 2s

  # 3. Vite React Frontend on 0.0.0.0:18081 via Taskfile
  web:
    run: task dev:web
    port: 18081
    depends_on: [api]
